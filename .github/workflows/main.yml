name: Ci For cpp Code

permissions:
  contents: read
  push: write 

on:
  push:
    branches: ["main", "Tensor/*", "tensor/*"]
    paths-ignore:
      - "docs/*"
      - "*.md"
      - "LICENSE"
      - "Documentation/**"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "Documentation/**"

jobs:
  Testing-Formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:  
          thread-comments: ${{ github.event_name == 'push' && 'update' }}

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  Testing-building:
    runs-on: ubuntu-latest
    needs: Testing-Formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checking_availablitiy_CMake_files
        id: CM
        run : |
          if [ -f Code/CMakeLists.txt ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT" 
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi 

      - name: Setup building tools C++
        if: steps.CM.outputs.valid == 'true'
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          cmake: true
          ninja: true

      - name: Cache CMake build directory
        if: steps.CM.outputs.valid == 'true'
        uses: actions/cache@v6
        with:
          path: Code/build
          key: ${{ runner.os }}-build-v1-${{ hashFiles('Code/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-v1-

      - name: Config CMake files
        if: steps.CM.outputs.valid == 'true'
        run: |
          cmake -S Code -B Code/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release 

      - name: Building
        if: steps.CM.outputs.valid == 'true'
        run: |
          cmake --build Code/build --parallel

      - name: Run Tests
        if: steps.CM.outputs.valid == 'true'
        working-directory: Code/build
        run: |
          ctest --output-on-failure --verbose
